<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Hope">
  
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/❤️?size=180">
  
  <title>Daily Hope – Lock Screen Notifications</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 42rem;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      padding: 2rem;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }
    .hope-message {
      font-weight: 600;
      color: #1f2937;
      line-height: 1.6;
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 1rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-radius: 1rem;
    }
    .verse-box {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      border-radius: 1rem;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .verse-text {
      font-style: italic;
      color: #374151;
      text-align: center;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, button, select {
      width: 100%;
      padding: 0.875rem;
      border-radius: 1rem;
      border: 2px solid #e5e7eb;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #667eea;
    }
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .notification-btn {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .slider-label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }
    input[type="range"] { padding: 0; }
    .flex-row { display: flex; gap: 0.75rem; }
    .flex-row select, .flex-row button { flex: 1; }
    .status {
      font-size: 0.875rem;
      text-align: center;
      padding: 0.75rem;
      background: #f0fdf4;
      border-radius: 0.75rem;
      border-left: 4px solid #10b981;
      color: #065f46;
    }
    .warning {
      background: #fef3c7;
      border-left-color: #f59e0b;
      color: #92400e;
    }
    hr { margin: 0.75rem 0; border: none; height: 1px; background: #e5e7eb; }
    .install-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: auto;
      padding: 0.875rem 1.5rem;
      z-index: 50;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
    }
    @media (max-width: 640px) {
      .card { padding: 1.25rem; }
      h1 { font-size: 1.5rem; }
      .hope-message { font-size: 1.1rem; padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💙 Daily Hope</h1>
    
    <div class="hope-message" id="hopeMessage">Loading...</div>
    <div class="verse-box">
      <div class="verse-text" id="verseText">Loading...</div>
    </div>
    
    <div class="controls">
      <input type="text" id="customMessageInput" placeholder="✏️ Write your own hope message">
      <input type="text" id="customVerseInput" placeholder="✏️ Write your own comforting verse">
      <div>
        <label class="slider-label">🔤 Text size: <span id="sizeValue">22</span>px</label>
        <input type="range" id="fontSizeSlider" min="16" max="40" value="22">
      </div>
      <button id="updateBtn">🔄 Update Message</button>
      
      <hr>
      <div class="flex-row">
        <select id="notifyInterval">
          <option value="30">⏰ Every 30 minutes</option>
          <option value="60">⏰ Every 1 hour</option>
          <option value="120">⏰ Every 2 hours</option>
        </select>
        <button id="startNotifyBtn" class="notification-btn">🔔 Enable Lock Screen Alerts</button>
      </div>
      <div id="notifyStatus" class="status">
        💡 <strong>Lock Screen Alerts:</strong> Click "Enable" → Allow Notifications → You'll get popups on your lock screen!
      </div>
    </div>
  </div>
  
  <button id="installBtn" class="install-btn">📲 Install to Home Screen</button>

  <script>
    // Create manifest for installation
    const manifestData = {
      name: "Daily Hope",
      short_name: "Hope",
      description: "Lock screen hope message alerts",
      start_url: "/",
      display: "standalone",
      theme_color: "#667eea",
      background_color: "#ffffff",
      icons: [
        { src: "https://emojicdn.elk.sh/❤️?size=72", sizes: "72x72", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=96", sizes: "96x96", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=128", sizes: "128x128", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=144", sizes: "144x144", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=192", sizes: "192x192", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=512", sizes: "512x512", type: "image/png" }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);

    // ========== DATA ==========
    const defaultMessages = [
      "✨ Keep going — brighter days are ahead.",
      "💪 You are stronger than this moment.",
      "🕊️ Peace will find you again.",
      "🌧️ Every storm runs out of rain.",
      "👣 Small steps still move you forward.",
      "📖 Your story is not over yet.",
      "🙏 Grace will carry you through.",
      "🌱 Hope grows even in quiet places.",
      "🌟 You are loved more than you know.",
      "💖 This too shall pass.",
      "🌈 A new day brings new mercies."
    ];
    
    const defaultVerses = [
      "Psalm 46:1 — God is our refuge and strength",
      "Isaiah 41:10 — Do not fear, for I am with you",
      "Jeremiah 29:11 — For I know the plans I have for you",
      "Matthew 11:28 — Come to me, all who are weary",
      "Romans 15:13 — May the God of hope fill you with joy",
      "Philippians 4:13 — I can do all things through Christ"
    ];

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // DOM elements
    const hopeMessageEl = document.getElementById('hopeMessage');
    const verseTextEl = document.getElementById('verseText');
    const customMessageInput = document.getElementById('customMessageInput');
    const customVerseInput = document.getElementById('customVerseInput');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const sizeValueSpan = document.getElementById('sizeValue');
    const updateBtn = document.getElementById('updateBtn');
    const installBtn = document.getElementById('installBtn');
    const startNotifyBtn = document.getElementById('startNotifyBtn');
    const notifyIntervalSelect = document.getElementById('notifyInterval');
    const notifyStatus = document.getElementById('notifyStatus');

    // State
    let customMessage = '';
    let customVerse = '';
    let fontSize = 22;
    let notifyTimer = null;
    let notifyActive = false;

    function getCurrentMessage() {
      return customMessage.trim() !== '' ? customMessage : randomItem(defaultMessages);
    }
    
    function getCurrentVerse() {
      return customVerse.trim() !== '' ? customVerse : randomItem(defaultVerses);
    }

    function refreshDisplay() {
      hopeMessageEl.textContent = getCurrentMessage();
      verseTextEl.textContent = getCurrentVerse();
    }

    function applyFontSize() {
      hopeMessageEl.style.fontSize = fontSize + 'px';
      verseTextEl.style.fontSize = (fontSize - 2) + 'px';
      sizeValueSpan.textContent = fontSize;
    }

    function handleUpdate() {
      customMessage = customMessageInput.value;
      customVerse = customVerseInput.value;
      refreshDisplay();
      localStorage.setItem('customMessage', customMessage);
      localStorage.setItem('customVerse', customVerse);
    }

    // ========== LOCK SCREEN NOTIFICATIONS ==========
    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        notifyStatus.innerHTML = `❌ Your browser doesn't support notifications. Try Chrome or Safari.`;
        return false;
      }
      
      if (Notification.permission === "granted") {
        return true;
      }
      
      if (Notification.permission !== "denied") {
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          notifyStatus.innerHTML = `✅ Notifications enabled! You'll get lock screen alerts!`;
          return true;
        } else {
          notifyStatus.innerHTML = `⚠️ You blocked notifications. Please allow them in browser settings.`;
          return false;
        }
      }
      
      notifyStatus.innerHTML = `⚠️ Notifications blocked. Please check browser settings to enable.`;
      return false;
    }
    
    function sendLockScreenNotification() {
      if (!notifyActive) return;
      
      const message = getCurrentMessage();
      const verse = getCurrentVerse();
      
      if (Notification.permission === "granted") {
        // This appears on LOCK SCREEN!
        const notification = new Notification("💙 Daily Hope Reminder", {
          body: message + "\n\n" + verse,
          icon: "https://emojicdn.elk.sh/❤️?size=128",
          badge: "https://emojicdn.elk.sh/❤️?size=72",
          tag: "hope-reminder",
          renotify: true,
          silent: false,
          vibrate: [200, 100, 200]
        });
        
        // When user taps notification, open the app
        notification.onclick = () => {
          window.focus();
          notification.close();
        };
        
        const minutes = notifyIntervalSelect.value;
        notifyStatus.innerHTML = `🔔 <strong>Alert sent to your lock screen!</strong><br>Next alert in ${minutes} minutes. Make sure your phone isn't on Do Not Disturb mode.`;
        
        // Reset status after 5 seconds
        setTimeout(() => {
          if (notifyActive) {
            notifyStatus.innerHTML = `✅ Active! Alerts every ${minutes} minutes on your lock screen. 🔔`;
          }
        }, 5000);
      }
    }
    
    function startNotifications(minutes) {
      if (notifyTimer) clearInterval(notifyTimer);
      
      // Send first notification immediately
      setTimeout(() => sendLockScreenNotification(), 1000);
      
      // Set interval
      notifyTimer = setInterval(() => {
        sendLockScreenNotification();
      }, minutes * 60 * 1000);
      
      notifyActive = true;
      localStorage.setItem('notifyActive', 'true');
      localStorage.setItem('notifyMinutes', minutes);
      
      startNotifyBtn.textContent = '🛑 Disable Lock Screen Alerts';
      startNotifyBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
      notifyStatus.innerHTML = `✅ <strong>ACTIVE!</strong> You'll get hope messages on your LOCK SCREEN every ${minutes} minutes! 🔔<br>Keep your browser running in background.`;
    }
    
    function stopNotifications() {
      if (notifyTimer) {
        clearInterval(notifyTimer);
        notifyTimer = null;
      }
      notifyActive = false;
      localStorage.removeItem('notifyActive');
      
      startNotifyBtn.textContent = '🔔 Enable Lock Screen Alerts';
      startNotifyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      notifyStatus.innerHTML = `⏸️ Alerts stopped. Click "Enable" to start again.`;
    }
    
    async function handleStartNotifications() {
      const granted = await requestNotificationPermission();
      if (!granted) return;
      
      if (notifyActive) {
        stopNotifications();
      } else {
        const minutes = parseInt(notifyIntervalSelect.value, 10);
        startNotifications(minutes);
      }
    }
    
    // Check if app is installed
    function checkInstalled() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone === true;
      if (isStandalone) {
        document.getElementById('installedIndicator')?.remove();
        notifyStatus.innerHTML = `🎉 App installed! Now click "Enable Lock Screen Alerts" for hope messages on your lock screen!`;
      }
    }
    
    // Load saved settings
    function loadSavedSettings() {
      const savedMessage = localStorage.getItem('customMessage');
      const savedVerse = localStorage.getItem('customVerse');
      const savedFontSize = localStorage.getItem('fontSize');
      const savedNotifyActive = localStorage.getItem('notifyActive');
      const savedNotifyMinutes = localStorage.getItem('notifyMinutes');
      
      if (savedMessage) {
        customMessage = savedMessage;
        customMessageInput.value = savedMessage;
      }
      if (savedVerse) {
        customVerse = savedVerse;
        customVerseInput.value = savedVerse;
      }
      if (savedFontSize) {
        fontSize = parseInt(savedFontSize);
        fontSizeSlider.value = fontSize;
        applyFontSize();
      }
      
      refreshDisplay();
      
      // Check notification permission status
      if (Notification.permission === "granted" && savedNotifyActive === 'true' && savedNotifyMinutes) {
        setTimeout(() => startNotifications(parseInt(savedNotifyMinutes)), 1000);
      } else if (savedNotifyActive === 'true') {
        localStorage.removeItem('notifyActive');
      }
    }

    // Auto-refresh every hour
    setInterval(() => refreshDisplay(), 60 * 60 * 1000);

    // Event listeners
    updateBtn.addEventListener('click', handleUpdate);
    fontSizeSlider.addEventListener('input', (e) => {
      fontSize = Number(e.target.value);
      applyFontSize();
      localStorage.setItem('fontSize', fontSize);
    });
    startNotifyBtn.addEventListener('click', handleStartNotifications);

    // PWA Install
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        notifyStatus.innerHTML = `📱 To install: Chrome menu → "Add to Home Screen" or Safari Share → "Add to Home Screen"`;
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
        checkInstalled();
      }
      deferredPrompt = null;
    });

    // Service Worker
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        const swCode = `const CACHE = 'hope-v5';
const urls = ['/', '/index.html'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(urls))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(() => {});
      });
    }

    // Initialize
    refreshDisplay();
    applyFontSize();
    loadSavedSettings();
    checkInstalled();
  </script>
</body>
</html>
