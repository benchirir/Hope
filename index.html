<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Daily%20Hope%22,
    %22short_name%22:%22Hope%22,
    %22description%22:%22Daily%20hope%20messages%20and%20comforting%20verses%22,
    %22start_url%22:%22/%22,
    %22display%22:%22standalone%22,
    %22theme_color%22:%22%23ffffff%22,
    %22background_color%22:%22%23ffffff%22,
    %22icons%22:[
      { %22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3E❤%3C/text%3E%3C/svg%3E%22, %22sizes%22:%22any%22, %22type%22:%22image/svg+xml%22 }
    ]
  }">
  <title>Daily Hope – Installable App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 42rem;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1);
      padding: 1.5rem;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 1.875rem;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
      margin-bottom: 1.5rem;
    }
    .message-container {
      text-align: center;
      margin-bottom: 1rem;
    }
    .hope-message {
      font-weight: 500;
      color: #374151;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .verse-box {
      background: #f9fafb;
      border-radius: 0.75rem;
      border: 1px solid #e5e7eb;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .verse-text {
      font-style: italic;
      color: #4b5563;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
      ring: 2px solid #3b82f6;
    }
    button {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .slider-label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      display: block;
    }
    input[type="range"] {
      padding: 0;
    }
    .install-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: #16a34a;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      border: none;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      z-index: 50;
    }
    .install-btn:hover {
      background-color: #15803d;
    }
    @media (max-width: 640px) {
      .card { padding: 1rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>Daily Hope</h1>
    <div class="message-container">
      <div class="hope-message" id="hopeMessage">Loading...</div>
      <div class="verse-box">
        <div class="verse-text" id="verseText">Loading...</div>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="customMessageInput" placeholder="Write your own hope message">
      <input type="text" id="customVerseInput" placeholder="Write your own comforting verse">
      <div>
        <label class="slider-label">Text size: <span id="sizeValue">22</span>px</label>
        <input type="range" id="fontSizeSlider" min="16" max="40" value="22">
      </div>
      <button id="updateBtn">Update Message</button>
    </div>
  </div>
  <button id="installBtn" class="install-btn" style="display: none;">📲 Install App</button>

  <script>
    // ---------- DATA ----------
    const defaultMessages = [
      "Keep going — brighter days are ahead.",
      "You are stronger than this moment.",
      "Peace will find you again.",
      "Every storm runs out of rain.",
      "Small steps still move you forward.",
      "Your story is not over yet.",
      "Grace will carry you through.",
      "Hope grows even in quiet places."
    ];
    const defaultVerses = [
      "Psalm 46:1 — God is our refuge and strength, an ever-present help in trouble.",
      "Isaiah 41:10 — Do not fear, for I am with you.",
      "Jeremiah 29:11 — For I know the plans I have for you.",
      "Matthew 11:28 — Come to me, all who are weary.",
      "Romans 15:13 — May the God of hope fill you with joy and peace.",
      "Philippians 4:13 — I can do all things through Christ who strengthens me."
    ];

    function randomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // DOM elements
    const hopeMessageEl = document.getElementById('hopeMessage');
    const verseTextEl = document.getElementById('verseText');
    const customMessageInput = document.getElementById('customMessageInput');
    const customVerseInput = document.getElementById('customVerseInput');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const sizeValueSpan = document.getElementById('sizeValue');
    const updateBtn = document.getElementById('updateBtn');
    const installBtn = document.getElementById('installBtn');

    // State
    let currentMessage = randomItem(defaultMessages);
    let currentVerse = randomItem(defaultVerses);
    let customMessage = '';
    let customVerse = '';
    let fontSize = 22;

    // Update UI
    function refreshDisplay() {
      // Use custom if provided, else random default
      const msg = customMessage.trim() !== '' ? customMessage : randomItem(defaultMessages);
      const ver = customVerse.trim() !== '' ? customVerse : randomItem(defaultVerses);
      currentMessage = msg;
      currentVerse = ver;
      hopeMessageEl.textContent = currentMessage;
      verseTextEl.textContent = currentVerse;
    }

    function applyFontSize() {
      hopeMessageEl.style.fontSize = fontSize + 'px';
      verseTextEl.style.fontSize = (fontSize - 2) + 'px';
      sizeValueSpan.textContent = fontSize;
    }

    function handleUpdate() {
      customMessage = customMessageInput.value;
      customVerse = customVerseInput.value;
      refreshDisplay();
    }

    function handleFontSizeChange(e) {
      fontSize = Number(e.target.value);
      applyFontSize();
    }

    // Auto-refresh every hour (keeps using current custom values)
    setInterval(() => {
      // Re-read custom inputs in case they changed
      customMessage = customMessageInput.value;
      customVerse = customVerseInput.value;
      refreshDisplay();
    }, 60 * 60 * 1000);

    // Event listeners
    updateBtn.addEventListener('click', handleUpdate);
    fontSizeSlider.addEventListener('input', handleFontSizeChange);

    // Initial display
    refreshDisplay();
    applyFontSize();

    // ---------- PWA: Install prompt ----------
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // ---------- Simple service worker for offline (if served over HTTP) ----------
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        const swCode = `const CACHE_NAME = 'hope-v1';
const urlsToCache = ['/', '/index.html'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).then(reg => {
          console.log('Service worker registered');
          URL.revokeObjectURL(url);
        }).catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
