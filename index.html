<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Hope">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/❤️?size=256">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <title>Daily Hope – Installable App</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 42rem;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1);
      padding: 1.5rem;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 1.875rem;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .hope-message {
      font-weight: 500;
      color: #374151;
      line-height: 1.5;
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 1rem;
      padding: 1rem;
      background: #fef3c7;
      border-radius: 1rem;
    }
    .verse-box {
      background: #f9fafb;
      border-radius: 0.75rem;
      border: 1px solid #e5e7eb;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .verse-text {
      font-style: italic;
      color: #4b5563;
      text-align: center;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, button, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }
    button {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
      transform: scale(0.98);
    }
    .badge-btn {
      background-color: #16a34a;
    }
    .badge-btn:hover {
      background-color: #15803d;
    }
    .install-btn {
      background: linear-gradient(135deg, #0891b2, #06b6d4);
    }
    .install-btn:hover {
      background: linear-gradient(135deg, #0e7490, #0891b2);
    }
    .slider-label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      display: block;
    }
    input[type="range"] {
      padding: 0;
    }
    .flex-row {
      display: flex;
      gap: 0.5rem;
    }
    .flex-row select, .flex-row button {
      flex: 1;
    }
    .status {
      font-size: 0.875rem;
      text-align: center;
      color: #4b5563;
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: #f3f4f6;
      border-radius: 0.5rem;
    }
    .badge-preview {
      display: inline-block;
      background: #ef4444;
      color: white;
      border-radius: 9999px;
      padding: 0.125rem 0.5rem;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .installed-badge {
      background: #22c55e;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
    hr {
      margin: 0.5rem 0;
      border-color: #e5e7eb;
    }
    .bottom-buttons {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.5rem;
      z-index: 50;
    }
    .bottom-buttons button {
      width: auto;
      padding: 0.75rem 1.25rem;
      border-radius: 9999px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    @media (max-width: 640px) {
      .card { padding: 1rem; }
      h1 { font-size: 1.5rem; }
      .bottom-buttons { bottom: 1rem; right: 1rem; }
      .bottom-buttons button { padding: 0.5rem 1rem; font-size: 0.875rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      💙 Daily Hope
      <span id="badgeIndicator" style="display:none;" class="badge-preview">!</span>
      <span id="installedIndicator" style="display:none;" class="installed-badge">✓ Installed</span>
    </h1>
    
    <div class="hope-message" id="hopeMessage">Loading...</div>
    <div class="verse-box">
      <div class="verse-text" id="verseText">Loading...</div>
    </div>
    
    <div class="controls">
      <input type="text" id="customMessageInput" placeholder="✏️ Write your own hope message">
      <input type="text" id="customVerseInput" placeholder="✏️ Write your own comforting verse">
      <div>
        <label class="slider-label">🔤 Text size: <span id="sizeValue">22</span>px</label>
        <input type="range" id="fontSizeSlider" min="16" max="40" value="22">
      </div>
      <button id="updateBtn">🔄 Update Message</button>
      
      <hr>
      <div class="flex-row">
        <select id="badgeInterval">
          <option value="30">⏰ Every 30 minutes</option>
          <option value="60">⏰ Every 1 hour</option>
        </select>
        <button id="startBadgeBtn" class="badge-btn">🔔 Show Badge on Home Screen</button>
      </div>
      <div id="badgeStatus" class="status">
        💡 Click "📲 Install App" below → then click "Show Badge"!
      </div>
    </div>
  </div>
  
  <div class="bottom-buttons">
    <button id="installBtn" class="install-btn">📲 Install App</button>
  </div>

  <script>
    // Create manifest.json dynamically
    const manifestData = {
      name: "Daily Hope",
      short_name: "Hope",
      description: "Daily hope messages with home screen badges",
      start_url: "/",
      display: "standalone",
      theme_color: "#3b82f6",
      background_color: "#ffffff",
      icons: [
        {
          src: "https://emojicdn.elk.sh/❤️?size=72",
          sizes: "72x72",
          type: "image/png"
        },
        {
          src: "https://emojicdn.elk.sh/❤️?size=96",
          sizes: "96x96",
          type: "image/png"
        },
        {
          src: "https://emojicdn.elk.sh/❤️?size=128",
          sizes: "128x128",
          type: "image/png"
        },
        {
          src: "https://emojicdn.elk.sh/❤️?size=144",
          sizes: "144x144",
          type: "image/png"
        },
        {
          src: "https://emojicdn.elk.sh/❤️?size=192",
          sizes: "192x192",
          type: "image/png"
        },
        {
          src: "https://emojicdn.elk.sh/❤️?size=512",
          sizes: "512x512",
          type: "image/png"
        }
      ]
    };

    // Create and inject manifest
    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const manifestLink = document.querySelector('link[rel="manifest"]');
    if (manifestLink) {
      manifestLink.href = manifestURL;
    }

    // ========== DATA ==========
    const defaultMessages = [
      "✨ Keep going — brighter days are ahead.",
      "💪 You are stronger than this moment.",
      "🕊️ Peace will find you again.",
      "🌧️ Every storm runs out of rain.",
      "👣 Small steps still move you forward.",
      "📖 Your story is not over yet.",
      "🙏 Grace will carry you through.",
      "🌱 Hope grows even in quiet places.",
      "🌟 You are loved more than you know.",
      "💖 This too shall pass.",
      "🌈 A new day brings new mercies.",
      "⭐ You are not alone in this journey."
    ];
    
    const defaultVerses = [
      "Psalm 46:1 — God is our refuge and strength",
      "Isaiah 41:10 — Do not fear, for I am with you",
      "Jeremiah 29:11 — For I know the plans I have for you",
      "Matthew 11:28 — Come to me, all who are weary",
      "Romans 15:13 — May the God of hope fill you with joy",
      "Philippians 4:13 — I can do all things through Christ",
      "Psalm 34:18 — The Lord is close to the brokenhearted",
      "John 14:27 — Peace I leave with you"
    ];

    function randomItem(arr) { 
      return arr[Math.floor(Math.random() * arr.length)]; 
    }

    // ========== DOM ELEMENTS ==========
    const hopeMessageEl = document.getElementById('hopeMessage');
    const verseTextEl = document.getElementById('verseText');
    const customMessageInput = document.getElementById('customMessageInput');
    const customVerseInput = document.getElementById('customVerseInput');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const sizeValueSpan = document.getElementById('sizeValue');
    const updateBtn = document.getElementById('updateBtn');
    const installBtn = document.getElementById('installBtn');
    const startBadgeBtn = document.getElementById('startBadgeBtn');
    const badgeIntervalSelect = document.getElementById('badgeInterval');
    const badgeStatus = document.getElementById('badgeStatus');
    const badgeIndicator = document.getElementById('badgeIndicator');
    const installedIndicator = document.getElementById('installedIndicator');

    // ========== STATE ==========
    let customMessage = '';
    let customVerse = '';
    let fontSize = 22;
    let badgeTimer = null;
    let badgeActive = false;
    let isAppInstalled = false;
    let deferredPrompt = null;

    // ========== CORE FUNCTIONS ==========
    function getCurrentMessage() {
      return customMessage.trim() !== '' ? customMessage : randomItem(defaultMessages);
    }
    
    function getCurrentVerse() {
      return customVerse.trim() !== '' ? customVerse : randomItem(defaultVerses);
    }

    function refreshDisplay() {
      hopeMessageEl.textContent = getCurrentMessage();
      verseTextEl.textContent = getCurrentVerse();
    }

    function applyFontSize() {
      hopeMessageEl.style.fontSize = fontSize + 'px';
      verseTextEl.style.fontSize = (fontSize - 2) + 'px';
      sizeValueSpan.textContent = fontSize;
    }

    function handleUpdate() {
      customMessage = customMessageInput.value;
      customVerse = customVerseInput.value;
      refreshDisplay();
      localStorage.setItem('customMessage', customMessage);
      localStorage.setItem('customVerse', customVerse);
      if (badgeActive) {
        badgeStatus.innerHTML = `✅ Message updated! New message will appear on next badge.`;
      }
    }

    function handleFontSizeChange(e) {
      fontSize = Number(e.target.value);
      applyFontSize();
      localStorage.setItem('fontSize', fontSize);
    }

    // ========== HOME SCREEN BADGE ==========
    function updateBadge(count) {
      if (navigator.setAppBadge) {
        if (count > 0) {
          navigator.setAppBadge(count).catch(err => console.log('Badge API not supported'));
          badgeIndicator.style.display = 'inline-block';
          badgeIndicator.textContent = count > 9 ? '9+' : count;
        } else {
          navigator.clearAppBadge().catch(err => console.log('Cannot clear badge'));
          badgeIndicator.style.display = 'none';
        }
      } else {
        if (count > 0) {
          badgeIndicator.style.display = 'inline-block';
          badgeIndicator.textContent = '🔴';
          document.title = `(🔔) Daily Hope`;
        } else {
          badgeIndicator.style.display = 'none';
          document.title = `Daily Hope`;
        }
      }
    }
    
    function triggerBadgeAndRefresh() {
      updateBadge(1);
      refreshDisplay();
      
      const minutes = badgeIntervalSelect.value;
      badgeStatus.innerHTML = `🔴 NEW MESSAGE! Check the badge on your home screen icon!<br>Next badge in ${minutes} minutes. Tap the icon to see your hope message. 💙`;
      
      setTimeout(() => {
        if (badgeActive) {
          updateBadge(0);
          badgeStatus.innerHTML = `✅ Badge active! Next one in ${minutes} minutes. The app icon will show a badge. Tap it to see your hope message! 📱`;
        }
      }, 10000);
    }
    
    function startBadge(minutes) {
      if (badgeTimer) clearInterval(badgeTimer);
      triggerBadgeAndRefresh();
      
      badgeTimer = setInterval(() => {
        triggerBadgeAndRefresh();
      }, minutes * 60 * 1000);
      
      badgeActive = true;
      localStorage.setItem('badgeActive', 'true');
      localStorage.setItem('badgeMinutes', minutes);
      
      startBadgeBtn.textContent = '🛑 Stop Badge';
      startBadgeBtn.style.backgroundColor = '#dc2626';
      badgeStatus.innerHTML = `✅ ACTIVE! Your app icon will show a badge every ${minutes} minutes.<br>📱 Tap the app icon to see your fresh hope message!`;
    }
    
    function stopBadge() {
      if (badgeTimer) {
        clearInterval(badgeTimer);
        badgeTimer = null;
      }
      badgeActive = false;
      updateBadge(0);
      localStorage.removeItem('badgeActive');
      
      startBadgeBtn.textContent = '🔔 Show Badge on Home Screen';
      startBadgeBtn.style.backgroundColor = '#16a34a';
      badgeStatus.innerHTML = `⏸️ Badge stopped. Click "Show Badge" to restart.`;
    }
    
    function handleStartBadge() {
      if (!isAppInstalled) {
        badgeStatus.innerHTML = `⚠️ Please install the app first! Click the blue "Install App" button below, then try again. 🚀`;
        return;
      }
      
      if (badgeActive) {
        stopBadge();
      } else {
        const minutes = parseInt(badgeIntervalSelect.value, 10);
        startBadge(minutes);
      }
    }
    
    // ========== CHECK IF APP IS INSTALLED ==========
    function checkIfInstalled() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone === true;
      
      if (isStandalone) {
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
        badgeStatus.innerHTML = `🎉 App is INSTALLED on your home screen!<br>Now click "Show Badge" - you'll see badges on the app icon every 30 minutes! 📱`;
      }
    }
    
    window.matchMedia('(display-mode: standalone)').addEventListener('change', (e) => {
      if (e.matches) {
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
      }
    });
    
    // ========== LOAD SAVED SETTINGS ==========
    function loadSavedSettings() {
      const savedMessage = localStorage.getItem('customMessage');
      const savedVerse = localStorage.getItem('customVerse');
      const savedFontSize = localStorage.getItem('fontSize');
      const savedBadgeActive = localStorage.getItem('badgeActive');
      const savedBadgeMinutes = localStorage.getItem('badgeMinutes');
      
      if (savedMessage) {
        customMessage = savedMessage;
        customMessageInput.value = savedMessage;
      }
      if (savedVerse) {
        customVerse = savedVerse;
        customVerseInput.value = savedVerse;
      }
      if (savedFontSize) {
        fontSize = parseInt(savedFontSize);
        fontSizeSlider.value = fontSize;
        applyFontSize();
      }
      
      refreshDisplay();
      
      if (savedBadgeActive === 'true' && savedBadgeMinutes && isAppInstalled) {
        setTimeout(() => {
          startBadge(parseInt(savedBadgeMinutes));
        }, 1000);
      }
    }

    // ========== AUTO-REFRESH ==========
    setInterval(() => refreshDisplay(), 60 * 60 * 1000);

    // ========== EVENT LISTENERS ==========
    updateBtn.addEventListener('click', handleUpdate);
    fontSizeSlider.addEventListener('input', handleFontSizeChange);
    startBadgeBtn.addEventListener('click', handleStartBadge);

    // ========== PWA INSTALL ==========
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
      badgeStatus.innerHTML = `✅ Click "Install App" to add Daily Hope to your home screen! Then you'll get badges on the icon. 🏠`;
    });
    
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
        badgeStatus.innerHTML = `🎉 PERFECT! App installed!<br>Now click "Show Badge" - you'll see red 🔴 badges on the app icon every 30 minutes!`;
      }
      deferredPrompt = null;
    });

    // ========== SERVICE WORKER ==========
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        const swCode = `const CACHE_NAME = 'hope-v3';
const urlsToCache = ['/', '/index.html'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).then(reg => {
          console.log('Service worker registered');
          URL.revokeObjectURL(url);
        }).catch(() => {});
      });
    }

    // ========== INITIALIZE ==========
    refreshDisplay();
    applyFontSize();
    checkIfInstalled();
    loadSavedSettings();
  </script>
</body>
</html>
