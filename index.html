<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Hope">
  
  <!-- Apple Touch Icon (works for iOS home screen) -->
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/❤️?size=180">
  
  <title>Daily Hope – Install to Home Screen</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 42rem;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      padding: 2rem;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .hope-message {
      font-weight: 600;
      color: #1f2937;
      line-height: 1.6;
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 1rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .verse-box {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      border-radius: 1rem;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .verse-text {
      font-style: italic;
      color: #374151;
      text-align: center;
      font-size: 1rem;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, button, select {
      width: 100%;
      padding: 0.875rem;
      border-radius: 1rem;
      border: 2px solid #e5e7eb;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(102,126,234,0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .badge-btn {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .install-btn {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      position: relative;
      overflow: hidden;
    }
    .install-btn::before {
      content: "📱";
      margin-right: 8px;
    }
    .slider-label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
      color: #374151;
    }
    input[type="range"] {
      padding: 0;
    }
    .flex-row {
      display: flex;
      gap: 0.75rem;
    }
    .flex-row select, .flex-row button {
      flex: 1;
    }
    .status {
      font-size: 0.875rem;
      text-align: center;
      padding: 0.75rem;
      background: #f0fdf4;
      border-radius: 0.75rem;
      border-left: 4px solid #10b981;
      color: #065f46;
    }
    .badge-preview {
      display: inline-block;
      background: #ef4444;
      color: white;
      border-radius: 9999px;
      padding: 0.25rem 0.6rem;
      font-size: 0.7rem;
      font-weight: bold;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .installed-badge {
      background: #10b981;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: bold;
    }
    hr {
      margin: 0.75rem 0;
      border: none;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e5e7eb, transparent);
    }
    .download-section {
      margin-top: 1rem;
      text-align: center;
      padding: 1rem;
      background: #fef3c7;
      border-radius: 1rem;
    }
    .download-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: inline-block;
      width: auto;
      padding: 0.75rem 1.5rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 640px) {
      .card { padding: 1.25rem; margin: 0.5rem; }
      h1 { font-size: 1.5rem; }
      .hope-message { font-size: 1.1rem; padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      💙 Daily Hope
      <span id="badgeIndicator" style="display:none;" class="badge-preview">!</span>
      <span id="installedIndicator" style="display:none;" class="installed-badge">✓ Installed</span>
    </h1>
    
    <div class="hope-message" id="hopeMessage">Loading...</div>
    <div class="verse-box">
      <div class="verse-text" id="verseText">Loading...</div>
    </div>
    
    <div class="controls">
      <input type="text" id="customMessageInput" placeholder="✏️ Write your own hope message...">
      <input type="text" id="customVerseInput" placeholder="✏️ Write your own comforting verse...">
      <div>
        <label class="slider-label">🔤 Text size: <span id="sizeValue">22</span>px</label>
        <input type="range" id="fontSizeSlider" min="16" max="40" value="22">
      </div>
      <button id="updateBtn">🔄 Update Message</button>
      
      <hr>
      <div class="flex-row">
        <select id="badgeInterval">
          <option value="30">⏰ Every 30 minutes</option>
          <option value="60">⏰ Every 1 hour</option>
          <option value="120">⏰ Every 2 hours</option>
        </select>
        <button id="startBadgeBtn" class="badge-btn">🔔 Show Badge on Home Screen</button>
      </div>
      <div id="badgeStatus" class="status">
        💡 <strong>How to install:</strong> Click "Install App" below → Add to Home Screen → Then click "Show Badge"!
      </div>
    </div>
  </div>
  
  <div class="bottom-buttons" style="position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; gap: 0.75rem; z-index: 50;">
    <button id="installBtn" class="install-btn" style="width: auto; padding: 0.875rem 1.5rem;">📲 Install App</button>
  </div>

  <script>
    // Create manifest.json dynamically for installation
    const manifestData = {
      name: "Daily Hope",
      short_name: "Hope",
      description: "Get daily hope messages with home screen badges",
      start_url: "/",
      display: "standalone",
      theme_color: "#667eea",
      background_color: "#ffffff",
      icons: [
        { src: "https://emojicdn.elk.sh/❤️?size=72", sizes: "72x72", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=96", sizes: "96x96", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=128", sizes: "128x128", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=144", sizes: "144x144", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=192", sizes: "192x192", type: "image/png" },
        { src: "https://emojicdn.elk.sh/❤️?size=512", sizes: "512x512", type: "image/png" }
      ]
    };

    // Inject manifest
    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);

    // ========== DATA ==========
    const defaultMessages = [
      "✨ Keep going — brighter days are ahead.",
      "💪 You are stronger than this moment.",
      "🕊️ Peace will find you again.",
      "🌧️ Every storm runs out of rain.",
      "👣 Small steps still move you forward.",
      "📖 Your story is not over yet.",
      "🙏 Grace will carry you through.",
      "🌱 Hope grows even in quiet places.",
      "🌟 You are loved more than you know.",
      "💖 This too shall pass.",
      "🌈 A new day brings new mercies.",
      "⭐ You are not alone in this journey.",
      "🌸 Beautiful things take time to grow.",
      "🔥 You are capable of amazing things."
    ];
    
    const defaultVerses = [
      "Psalm 46:1 — God is our refuge and strength",
      "Isaiah 41:10 — Do not fear, for I am with you",
      "Jeremiah 29:11 — For I know the plans I have for you",
      "Matthew 11:28 — Come to me, all who are weary",
      "Romans 15:13 — May the God of hope fill you with joy",
      "Philippians 4:13 — I can do all things through Christ",
      "Psalm 34:18 — The Lord is close to the brokenhearted",
      "John 14:27 — Peace I leave with you"
    ];

    function randomItem(arr) { 
      return arr[Math.floor(Math.random() * arr.length)]; 
    }

    // ========== DOM ELEMENTS ==========
    const hopeMessageEl = document.getElementById('hopeMessage');
    const verseTextEl = document.getElementById('verseText');
    const customMessageInput = document.getElementById('customMessageInput');
    const customVerseInput = document.getElementById('customVerseInput');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const sizeValueSpan = document.getElementById('sizeValue');
    const updateBtn = document.getElementById('updateBtn');
    const installBtn = document.getElementById('installBtn');
    const startBadgeBtn = document.getElementById('startBadgeBtn');
    const badgeIntervalSelect = document.getElementById('badgeInterval');
    const badgeStatus = document.getElementById('badgeStatus');
    const badgeIndicator = document.getElementById('badgeIndicator');
    const installedIndicator = document.getElementById('installedIndicator');

    // ========== STATE ==========
    let customMessage = '';
    let customVerse = '';
    let fontSize = 22;
    let badgeTimer = null;
    let badgeActive = false;
    let isAppInstalled = false;
    let deferredPrompt = null;

    // ========== CORE FUNCTIONS ==========
    function getCurrentMessage() {
      return customMessage.trim() !== '' ? customMessage : randomItem(defaultMessages);
    }
    
    function getCurrentVerse() {
      return customVerse.trim() !== '' ? customVerse : randomItem(defaultVerses);
    }

    function refreshDisplay() {
      hopeMessageEl.textContent = getCurrentMessage();
      verseTextEl.textContent = getCurrentVerse();
    }

    function applyFontSize() {
      hopeMessageEl.style.fontSize = fontSize + 'px';
      verseTextEl.style.fontSize = (fontSize - 2) + 'px';
      sizeValueSpan.textContent = fontSize;
    }

    function handleUpdate() {
      customMessage = customMessageInput.value;
      customVerse = customVerseInput.value;
      refreshDisplay();
      localStorage.setItem('customMessage', customMessage);
      localStorage.setItem('customVerse', customVerse);
      badgeStatus.innerHTML = `✅ Message updated! ${badgeActive ? 'Your next badge will show this message.' : 'Click "Show Badge" to start reminders!'}`;
    }

    // ========== HOME SCREEN BADGE ==========
    function updateBadge(count) {
      if (navigator.setAppBadge) {
        if (count > 0) {
          navigator.setAppBadge(count).catch(() => {});
          badgeIndicator.style.display = 'inline-block';
          badgeIndicator.textContent = count > 9 ? '9+' : count;
        } else {
          navigator.clearAppBadge().catch(() => {});
          badgeIndicator.style.display = 'none';
        }
      } else {
        if (count > 0) {
          badgeIndicator.style.display = 'inline-block';
          badgeIndicator.textContent = '🔴';
        } else {
          badgeIndicator.style.display = 'none';
        }
      }
    }
    
    function triggerBadgeAndRefresh() {
      updateBadge(1);
      refreshDisplay();
      
      const minutes = badgeIntervalSelect.value;
      badgeStatus.innerHTML = `🔴 <strong>New message ready!</strong> Look for the red badge on your app icon!<br>Next badge in ${minutes} minutes.`;
      
      setTimeout(() => {
        if (badgeActive) {
          updateBadge(0);
          badgeStatus.innerHTML = `✅ Badge active! Next reminder in ${minutes} minutes. Tap your app icon to see hope messages! 📱`;
        }
      }, 8000);
    }
    
    function startBadge(minutes) {
      if (badgeTimer) clearInterval(badgeTimer);
      triggerBadgeAndRefresh();
      
      badgeTimer = setInterval(() => {
        triggerBadgeAndRefresh();
      }, minutes * 60 * 1000);
      
      badgeActive = true;
      localStorage.setItem('badgeActive', 'true');
      localStorage.setItem('badgeMinutes', minutes);
      
      startBadgeBtn.textContent = '🛑 Stop Badge';
      startBadgeBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
      badgeStatus.innerHTML = `✅ <strong>REMINDERS ACTIVE!</strong> Your home screen icon will show a badge every ${minutes} minutes.<br>Tap the icon to see your fresh hope message! 💙`;
    }
    
    function stopBadge() {
      if (badgeTimer) {
        clearInterval(badgeTimer);
        badgeTimer = null;
      }
      badgeActive = false;
      updateBadge(0);
      localStorage.removeItem('badgeActive');
      
      startBadgeBtn.textContent = '🔔 Show Badge on Home Screen';
      startBadgeBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      badgeStatus.innerHTML = `⏸️ Reminders stopped. Click "Show Badge" to restart.`;
    }
    
    function handleStartBadge() {
      if (!isAppInstalled) {
        badgeStatus.innerHTML = `⚠️ <strong>Install first!</strong> Click the blue "Install App" button below, add to home screen, then open from there and try again. 🚀`;
        return;
      }
      
      if (badgeActive) {
        stopBadge();
      } else {
        const minutes = parseInt(badgeIntervalSelect.value, 10);
        startBadge(minutes);
      }
    }
    
    // ========== CHECK INSTALL STATUS ==========
    function checkIfInstalled() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone === true;
      
      if (isStandalone) {
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
        badgeStatus.innerHTML = `🎉 <strong>Great!</strong> App is installed on your home screen!<br>Now click "Show Badge" to start receiving reminders! 📱`;
      }
    }
    
    window.matchMedia('(display-mode: standalone)').addEventListener('change', (e) => {
      if (e.matches) {
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
      }
    });
    
    // ========== LOAD SAVED SETTINGS ==========
    function loadSavedSettings() {
      const savedMessage = localStorage.getItem('customMessage');
      const savedVerse = localStorage.getItem('customVerse');
      const savedFontSize = localStorage.getItem('fontSize');
      const savedBadgeActive = localStorage.getItem('badgeActive');
      const savedBadgeMinutes = localStorage.getItem('badgeMinutes');
      
      if (savedMessage) {
        customMessage = savedMessage;
        customMessageInput.value = savedMessage;
      }
      if (savedVerse) {
        customVerse = savedVerse;
        customVerseInput.value = savedVerse;
      }
      if (savedFontSize) {
        fontSize = parseInt(savedFontSize);
        fontSizeSlider.value = fontSize;
        applyFontSize();
      }
      
      refreshDisplay();
      
      if (savedBadgeActive === 'true' && savedBadgeMinutes && isAppInstalled) {
        setTimeout(() => startBadge(parseInt(savedBadgeMinutes)), 1500);
      }
    }

    // ========== AUTO-REFRESH ==========
    setInterval(() => refreshDisplay(), 60 * 60 * 1000);

    // ========== EVENT LISTENERS ==========
    updateBtn.addEventListener('click', handleUpdate);
    fontSizeSlider.addEventListener('input', handleFontSizeChange);
    startBadgeBtn.addEventListener('click', handleStartBadge);
    
    function handleFontSizeChange(e) {
      fontSize = Number(e.target.value);
      applyFontSize();
      localStorage.setItem('fontSize', fontSize);
    }

    // ========== PWA INSTALL PROMPT ==========
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
      badgeStatus.innerHTML = `📲 <strong>Ready to install!</strong> Click the "Install App" button below to add Daily Hope to your home screen!`;
    });
    
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        // Fallback instructions
        badgeStatus.innerHTML = `📱 <strong>To install manually:</strong><br>Chrome: Tap menu → "Add to Home Screen"<br>Safari: Tap Share → "Add to Home Screen"`;
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
        isAppInstalled = true;
        installedIndicator.style.display = 'inline-block';
        badgeStatus.innerHTML = `🎉 <strong>Success!</strong> App added to home screen!<br>Now open it from your home screen and click "Show Badge" to start reminders!`;
      }
      deferredPrompt = null;
    });

    // ========== SERVICE WORKER ==========
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        const swCode = `const CACHE = 'hope-v4';
const urls = ['/', '/index.html'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(urls))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(() => {});
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    }

    // ========== INITIALIZE ==========
    refreshDisplay();
    applyFontSize();
    checkIfInstalled();
    loadSavedSettings();
    
    // Show download instructions
    console.log('Daily Hope App - Ready to install!');
  </script>
</body>
</html>
